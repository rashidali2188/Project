<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />


    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            position: fixed;
            width: 50%;
            height: 50%;
            display: flex;
            background-color: #acdddf;
            margin-left: 25%;
            margin-top: 15%;
            border-radius: 1rem;
        }

        .title {
            width: 100%;
            text-align: center;
            margin-top: 15%;
            font-family: poppins, sans-serif;

        }

        .border {
            width: 16%;
            height: 1px;
            background-color: #333333;
            margin-left: 42%;
            margin-top: 5px;
        }

        .box {
            display: flex;
            text-align: center;
            position: absolute;
            top: 66%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333333;
            height: 3rem;
            border-radius: 3rem;
        }

        .search {
            background: none;
            outline: none;
            float: left;
            padding: 0;
            border: none;
            border-radius: 3rem;
            color: white;
            font-size: 12px;
            transition: 1s;
            width: 0px;
        }

        .button {
            border: none;
            background: #333333;
            font-size: 18px;
            float: right;
            color: #4cbb17;
            cursor: pointer;
            border-radius: 3rem;
            height: 3rem;
            width: 3rem;

        }

        .box:hover .search {
            width: 300px;
            padding-left: 20px;
        }

        .box:hover .button {
            background-color: white;
            height: 2.2rem;
            width: 2.2rem;
            margin: auto 6px;
        }

        .search:focus {
            width: 300px;
            padding-left: 20px;
        }
        @media (max-width: 768px) {
            .container {
                width: 80%;
                height: 60%;
                margin-left: 10%;
                margin-top: 20%;
            }

            .box:hover .search,
            .search:focus {
                width: 200px;
            }
             .box{
                top: 48%;}
            
        }
    </style>
</head>


<body>
    <div class="container">
        <div class="title">
            <h1>Search Bar</h1>
            <p>HTML & CSS</p>
            <div class="border"></div>
        </div>
        <div class="box">
            <input class="search" placeholder="Search...">
            <button class="button" type="submit"><i class="fas fa-search"></i></button>
        </div>
    </div>
</body>

</html>
